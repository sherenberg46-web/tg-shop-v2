server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    resolver 8.8.8.8 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend "https://tg-shop-production-1b03.up.railway.app";
        proxy_pass $backend$request_uri;
        proxy_set_header Host tg-shop-production-1b03.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Proxy uploaded images stored on the backend server
    location /static/ {
        set $backend "https://tg-shop-production-1b03.up.railway.app";
        proxy_pass $backend$request_uri;
        proxy_set_header Host tg-shop-production-1b03.up.railway.app;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        # Cache images in browser for 7 days
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
